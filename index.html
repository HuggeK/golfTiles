<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>golfTiles.org</title>
        <meta name="description" content="Free and open-source golf centric vector tiles with custom style for websites and apps, using OpenStreetMap data">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Maplibre stylesheet: -->
        <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
        <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
    </head>
    <body>
        <h1>golfTiles.org</h1>

        <p>Link to github repo: <a href="github.com/HuggeK/golfTiles">https://github.com/HuggeK/golfTiles</a></p>
        
        <h3>Example PMtiles: </h3>
            <ul>
                <li><a href="samples/golfTiles_se_dk_fi.pmtiles" download>samples/golfTiles_se_dk_fi.pmtiles</a></li>
                <li><a href="samples/golfTiles_sweden.pmtiles" download>samples/golfTiles_sweden.pmtiles</a></li>
                <li><a href="samples/golfTiles_united-kingdom.pmtiles" download>samples/golfTiles_sweden.pmtiles</a></li>
            </ul>

        <h2>Demo using Maplibre GL JS.: </h2>

        <div id="map" style="width: 100%; height: 500px"></div>
        <script>
        const map = new maplibregl.Map({
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [13.388, 52.517],
            zoom: 9.5,
            container: 'map',
        })
        </script>
    

    </body>
</html>
