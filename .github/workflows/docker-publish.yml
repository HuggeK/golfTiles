name: Publish container image

# Builds the golfTiles image (osmium-tool + tilemaker, see Dockerfile) and
# pushes it to the GitHub Container Registry on each published release.
# Public repos get free Actions minutes and free public GHCR storage/bandwidth,
# so this costs nothing for an open-source project. The published package must
# be set to Public once (repo -> Packages -> package settings -> visibility).

on:
  release:
    types: [published]
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR
    steps:
      - name: Checkout (with submodules — tilemaker source is needed to build)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no secret to configure

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # auto-lowercased -> ghcr.io/huggek/golftiles
          tags: |
            type=semver,pattern={{version}}          # v0.1.0 -> 0.1.0
            type=semver,pattern={{major}}.{{minor}}  # v0.1.0 -> 0.1
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: JOBS=4          # runner has 16 GB RAM; 4 parallel compiles fit
          cache-from: type=gha
          cache-to: type=gha,mode=max
